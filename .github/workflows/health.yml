name: Health check
# Deterministic production monitor. Opens one issue when the site is unhealthy and closes it on recovery.
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, check-latest: true }
      - id: smoke
        run: node scripts/smoke.mjs
        continue-on-error: true
      - name: Open or update the outage issue
        if: steps.smoke.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(gh issue list --label outage --state open --json number --jq '.[0].number // empty')
          body="Smoke test failed at $(date -u +%FT%TZ). Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          if [ -n "$n" ]; then gh issue comment "$n" --body "$body"; else gh issue create --title "Site health check failing" --label outage --body "$body"; fi
          exit 1
      - name: Close the outage issue on recovery
        if: steps.smoke.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(gh issue list --label outage --state open --json number --jq '.[0].number // empty')
          if [ -n "$n" ]; then gh issue close "$n" --comment "Recovered at $(date -u +%FT%TZ)."; fi
